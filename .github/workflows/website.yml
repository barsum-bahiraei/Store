name: Publish website

on:
  push:
    branches: [master]
    paths:
      - "Website/**"
      - "deploy/**"
      - ".github/workflows/website.yml"
      - ".github/workflows/_publish.yml"
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/_publish.yml
    with:
      service: website
      context: Website
      image: store-website
      image-tag-variable: WEBSITE_IMAGE_TAG
      build-args: |
        NEXT_PUBLIC_API_BASE_URL=${{ vars.WEBSITE_API_BASE_URL }}
    secrets: inherit
