name: store

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - store

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
    networks:
      - store

  backend:
    image: ghcr.io/${GHCR_OWNER}/store-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__StoreDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: http://${SERVER_PUBLIC_HOST}:${WEBSITE_PORT:-3000}
      Cors__AllowedOrigins__1: http://${SERVER_PUBLIC_HOST}:${PANEL_PORT:-3001}
      Minio__Endpoint: ${SERVER_PUBLIC_HOST}:${MINIO_PORT:-9000}
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__UseSsl: "false"
      Minio__Bucket: ${MINIO_BUCKET}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpireMinutes: ${JWT_EXPIRE_MINUTES}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - store

  website:
    image: ghcr.io/${GHCR_OWNER}/store-website:${WEBSITE_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEBSITE_PORT:-3000}:3000"
    networks:
      - store

  panel:
    image: ghcr.io/${GHCR_OWNER}/store-panel:${PANEL_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-3001}:3000"
    networks:
      - store

networks:
  store:

volumes:
  postgres_data:
  minio_data:
